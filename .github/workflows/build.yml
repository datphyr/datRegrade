name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.12" ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Check the LUT CLI works
        run: |
          python utils/cube.py info -i tests/data/swap_rb.cube
          python utils/cube.py compose \
            -i tests/data/swap_rb.cube \
            -c tests/data/halve_r.cube \
            -o /tmp/out.cube --preserve
          python utils/cube.py info -i /tmp/out.cube

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile
        run: |
          python -m compileall -q utils auto_regrade.py tests

      - name: Check the project generator runs
        run: |
          python -m pip install -r requirements.txt
          python auto_regrade.py \
            --source "SRC.mkv" --target "TGT.mkv" \
            --frames "100,200" --output-dir "CI" \
            --tonemapping "bt2390" --methods "rgb-1d"
          test -f REGRADES/CI/04_combine_luts.sh
