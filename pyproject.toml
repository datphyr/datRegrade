# Metadata and tool configuration.
#
# datRegrade is not distributed as an installable package: utils/cube.py is a
# standalone script invoked by path, and auto_regrade.py is run from the repo
# root. Dependencies are declared here for tooling and mirrored in
# requirements.txt, which is what the README tells you to install.
[project]
name = "datregrade"
version = "0.1.0"
description = "Prepare a colour-regrade project that matches an HDR source to a reference video"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "jinja2>=3.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
